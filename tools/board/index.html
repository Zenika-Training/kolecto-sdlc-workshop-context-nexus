<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #EE2238; --magenta: #BF1D67; --ink: #1E1E1E; --soft: #F2F2F2; --white: #FFFFFF;
    --muted: #5f5f5f; --line: #dedede;
    --ok: #047857; --warn: #B7791F; --warn-bg: #FDF3D7; --bad: #EE2238; --bad-bg: #FDE8EA; --ok-bg: #E3F4EC;
    --grad: linear-gradient(45deg, var(--red) 50%, var(--magenta));
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--soft); color: var(--ink); font: 16px/1.45 'Open Sans', system-ui, sans-serif; }
  h1, h2, h3 { font-family: 'Nunito', system-ui, sans-serif; margin: 0; }
  header { background: var(--ink); color: var(--white); padding: 14px 24px; display: flex; align-items: center; gap: 24px; }
  header .bar { width: 8px; align-self: stretch; background: var(--grad); border-radius: 4px; }
  header h1 { font-size: 26px; flex: 1; }
  header .clock { font: 700 30px 'Nunito', sans-serif; letter-spacing: 1px; }
  #banner { display: none; background: var(--grad); color: var(--white); padding: 12px 24px; font-weight: 600; }
  main { padding: 20px 24px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
  .card { background: var(--white); border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .wide { grid-column: 1 / -1; }
  .squad h2 { font-size: 24px; display: flex; gap: 10px; align-items: baseline; }
  .squad h2 .tag { background: var(--grad); color: var(--white); border-radius: 8px; padding: 0 10px; font-size: 22px; }
  .slice { color: var(--muted); margin: 4px 0 14px; }
  .gates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
  .gate { border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; min-height: 76px; }
  .gate b { font-family: 'Nunito', sans-serif; font-size: 20px; }
  .gate small { display: block; color: var(--muted); font-size: 13px; }
  .gate.GO { border-color: var(--ok); background: var(--ok-bg); }
  .gate.NO-GO { border-color: var(--bad); background: var(--bad-bg); }
  .gate.next { border-style: dashed; border-color: var(--ink); }
  .gate .v { font-weight: 700; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; }
  .pill { border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 600; background: var(--soft); }
  .pill.active { background: var(--ok-bg); color: var(--ok); }
  .pill.stale { background: var(--warn-bg); color: var(--warn); }
  .pill.draft { background: var(--soft); color: var(--muted); }
  .issues { margin-top: 10px; background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 8px 10px; border-radius: 6px; font-size: 14px; display: none; }
  .chain { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .node { border: 2px solid var(--ok); border-radius: 12px; padding: 10px 14px; min-width: 190px; background: var(--white); }
  .node b { font-family: 'Nunito', sans-serif; font-size: 18px; display: block; }
  .node.issue { border-color: var(--warn); background: var(--warn-bg); }
  .node.changed { border-color: var(--bad); background: var(--bad-bg); }
  .arrow { font-size: 28px; color: var(--muted); }
  .feed li { margin: 2px 0; font-size: 14px; }
  .feed time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 8px; }
  #keeper { display: none; }
  #keeper form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  #keeper input, #keeper select, #keeper button { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); }
  #keeper button { background: var(--ink); color: var(--white); border: 0; cursor: pointer; }
  #keeper button.event { background: var(--grad); }
  #msg { color: var(--muted); font-size: 14px; }
  @media (max-width: 640px) { main { grid-template-columns: 1fr; } .gates { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header><div class="bar"></div><h1 id="title">Room board</h1><div class="clock" id="clock">--:--</div></header>
<div id="banner"></div>
<main>
  <section class="card squad" id="squad-0"></section>
  <section class="card squad" id="squad-1"></section>
  <section class="card wide"><h3>Contract chain</h3><p class="slice">Who reads whom, at which version. Amber: a consumer is pinned to an outdated version. Red: just changed.</p><div class="chain" id="chain"></div></section>
  <section class="card wide" id="keeper">
    <h3>Gate keeper</h3>
    <form id="gateForm">
      <select name="squad" id="kSquad"></select>
      <select name="gate"><option>G1</option><option>G2</option><option>G3</option><option>G4</option></select>
      <select name="verdict"><option>GO</option><option>NO-GO</option></select>
      <input name="keeper" placeholder="Gate keeper name" required>
      <input name="note" placeholder="Reason (the criterion, for a NO-GO)" required size="40">
      <button>Record verdict</button>
    </form>
    <form id="eventForm"><button class="event">Fire the business change…</button><span id="msg"></span></form>
  </section>
  <section class="card wide"><h3>Latest publications</h3><ul class="feed" id="feed"></ul></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const hhmm = iso => iso ? iso.slice(11, 16) : '';
let state = null;

function renderSquad(el, s) {
  const gates = s.gates.map(g => `<div class="gate ${g.verdict || ''} ${s.next === g.gate ? 'next' : ''}">
    <b>${g.gate}</b><small>${esc(g.name)}</small>
    ${g.verdict ? `<div class="v">${g.verdict} · ${hhmm(g.at)}</div><small>${esc(g.keeper)}: ${esc(g.note)}</small>` : (s.next === g.gate ? '<small>next</small>' : '')}
  </div>`).join('');
  const rows = s.artefacts.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.register)}</td><td>${esc(a.version)}</td><td><span class="pill ${esc(a.status)}">${esc(a.status)}</span></td></tr>`).join('');
  const issues = s.issues.map(i => `<div><b>${esc(i.kind)}</b> ${esc(i.from.split('/').pop())} reads ${esc(i.path.split('/').pop())} @${esc(i.pinned)}, now ${esc(i.current || '—')}</div>`).join('');
  el.innerHTML = `<h2><span class="tag">${esc(s.number)}</span>${esc(s.label)}</h2><p class="slice">${esc(s.slice)}</p>
    <div class="gates">${gates}</div>
    <table><tr><th>Artefact</th><th>Register</th><th>Version</th><th>Status</th></tr>${rows}</table>
    <div class="issues" style="display:${issues ? 'block' : 'none'}">${issues}</div>`;
}

function render() {
  if (!state) return;
  $('title').textContent = state.title;
  state.squads.forEach((s, i) => $('squad-' + i) && renderSquad($('squad-' + i), s));
  $('chain').innerHTML = state.chain.map((n, i) => {
    const changed = state.event?.applied && i < 2;
    return `${i ? '<span class="arrow">→</span>' : ''}<div class="node ${changed ? 'changed' : n.issues ? 'issue' : ''}"><b>${esc(n.label)}</b>v${esc(n.version)} · ${esc(n.status)}${n.issues ? ` · ${n.issues} outdated pin(s)` : ''}</div>`;
  }).join('');
  $('feed').innerHTML = state.feed.map(f => `<li><time>${hhmm(f.at)}</time>${esc(f.subject)} <span class="slice">(${esc(f.who)})</span></li>`).join('');
  const b = $('banner');
  if (state.event?.applied) {
    const mins = state.event.appliedAt ? Math.max(0, Math.round((Date.now() - Date.parse(state.event.appliedAt)) / 60000)) : null;
    const open = state.squads.filter(s => s.stale).map(s => s.label);
    b.style.display = 'block';
    b.textContent = `Business change: ${state.event.title}${mins !== null ? ` · ${mins} min ago` : ''} · ${open.length ? 'still realigning: ' + open.join(', ') : 'both squads realigned ✓'}`;
  } else b.style.display = 'none';
  if (state.keeper) {
    $('keeper').style.display = 'block';
    if (!$('kSquad').options.length) $('kSquad').innerHTML = state.squads.map(s => `<option value="${s.id}">${s.number} · ${esc(s.label)}</option>`).join('');
  }
}

async function refresh() {
  try { state = await (await fetch('/api/state')).json(); render(); } catch { /* server restarting */ }
}
async function post(path, body) {
  const r = await (await fetch(path, { method: 'POST', body: JSON.stringify(body) })).json();
  $('msg').textContent = r.message; refresh();
}
$('gateForm').addEventListener('submit', e => { e.preventDefault(); post('/api/gate', Object.fromEntries(new FormData(e.target))); e.target.note.value = ''; });
$('eventForm').addEventListener('submit', e => {
  e.preventDefault();
  if (state?.event?.applied) { $('msg').textContent = 'Already applied.'; return; }
  if (confirm(`Read aloud, without comment:\n\n${state?.event?.say}\n\nApply the change to the Nexus now?`)) post('/api/event', {});
});
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString('en-GB', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit' }); }, 1000);
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
